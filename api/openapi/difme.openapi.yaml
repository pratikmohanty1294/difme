openapi: 3.1.0
info:
  title: DIFME Public API
  version: 1.0.0
  description: |
    External REST surface behind Kong (PDF §5.10). Every mutating call requires an `Idempotency-Key`
    header that must be a UUIDv7 (PDF §9); replays within 24h return the original response.
servers: [{ url: https://api.difme.local }]
security: [{ oauth2: [payments:write] }]
paths:
  /v1/payments:
    post:
      operationId: createPayment
      summary: Initiate a payment (PDF §7.1)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/TraceParent" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentRequest" } } }
      responses:
        "202": { description: "Accepted — saga started", content: { application/json: { schema: { $ref: "#/components/schemas/PaymentAccepted" } } } }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      security: [{ oauth2: [payments:read] }]
      parameters: [{ name: paymentId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid7" } }]
      responses:
        "200": { description: Payment, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/transfers:
    post:
      operationId: createTransfer
      summary: Cross-bank transfer saga (PDF §7.2)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/TraceParent" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransferRequest" } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentAccepted" } } } }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
  /v1/accounts/{accountId}:
    get:
      operationId: getAccount
      security: [{ oauth2: [accounts:read] }]
      parameters: [{ name: accountId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid7" } }]
      responses:
        "200": { description: "Account projection (eventual, follower read)", content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
  /v1/accounts/{accountId}/balance:
    get:
      operationId: getBalance
      security: [{ oauth2: [accounts:read] }]
      parameters: [{ name: accountId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid7" } }]
      responses:
        "200": { description: "Ledger balance (strict, from TigerBeetle)", content: { application/json: { schema: { $ref: "#/components/schemas/Balance" } } } }
  # ---- DiscountAI exchange (ADR-020; FR-01 pack first). Idempotency-Key is enforced at the gateway (PDF §9). ----
  /v1/exchange/{pack}/intents:
    post:
      operationId: openIntent
      summary: Open a sealed-bid auction for a buyer intent after the pack's eligibility rules (embedded DMN)
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/Pack" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeIntent" } } } }
      responses:
        "202": { description: Auction open, content: { application/json: { schema: { $ref: "#/components/schemas/IntentOpened" } } } }
        "400": { $ref: "#/components/responses/ExchangeError" }
        "404": { $ref: "#/components/responses/ExchangeError" }
        "422": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/{pack}/mandates:
    post:
      operationId: registerMandate
      summary: Register a buying partner's standing mandate (deposit requirement computed by the exchange)
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/Pack" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Mandate" } } } }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/MandateRegistered" } } } }
        "400": { $ref: "#/components/responses/ExchangeError" }
        "404": { $ref: "#/components/responses/ExchangeError" }
        "422": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/{pack}/mandates/{mandateId}/status:
    post:
      operationId: setMandateStatus
      summary: Pause (stops new bids), resume, or revoke (terminate; final) a buying partner's mandate
      security: [{ oauth2: [exchange:write] }]
      parameters:
        - { name: pack, in: path, required: true, schema: { type: string } }
        - { name: mandateId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ACTIVE, PAUSED, REVOKED] } } } } }
      responses:
        "200": { description: The mandate after the change, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/ExchangeError" }
        "404": { description: Unknown mandate }
        "409": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/{pack}/mandates/{mandateId}:
    get:
      operationId: getMandate
      summary: A standing mandate as the exchange tracks it (budget left, awards, yield earned, tier)
      security: [{ oauth2: [exchange:read] }]
      parameters:
        - { $ref: "#/components/parameters/Pack" }
        - { name: mandateId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Mandate state, content: { application/json: { schema: { $ref: "#/components/schemas/MandateState" } } } }
        "404": { description: Unknown mandate (or another vertical's) }
  /v1/exchange/{pack}/partners/{nodeRef}:
    get:
      operationId: getPartnerReputation
      summary: The exchange's FR-16 reputation for a buying partner in a vertical (null until its first outcome)
      security: [{ oauth2: [exchange:read] }]
      parameters: [{ $ref: "#/components/parameters/Pack" }, { name: nodeRef, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Reputation, content: { application/json: { schema: { type: object, properties: { pack: { type: string }, nodeRef: { type: integer }, reputation: { type: [number, "null"], minimum: 0, maximum: 100 }, tracked: { type: boolean }, verifiedDeliveries: { type: integer, minimum: 0 }, tier: { type: string, enum: [COLD_START, ESTABLISHED, ENTERPRISE] } } } } } }
        "404": { description: Unknown pack }
  /v1/exchange/auctions/{auctionId}/bids:
    post:
      operationId: placeBid
      summary: Place a sealed bid (bid-time eligibility against exchange-supplied facts)
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/AuctionId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Bid" } } } }
      responses:
        "202": { description: Bid accepted into the window }
        "400": { $ref: "#/components/responses/ExchangeError" }
        "404": { $ref: "#/components/responses/ExchangeError" }
        "409": { $ref: "#/components/responses/ExchangeError" }
        "422": { $ref: "#/components/responses/ExchangeError" }
        "503": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/auctions/{auctionId}:
    get:
      operationId: getAuction
      security: [{ oauth2: [exchange:read] }]
      parameters: [{ $ref: "#/components/parameters/AuctionId" }]
      responses:
        "200": { description: "The result (ranking, award) or {auctionId, status: OPEN}", content: { application/json: { schema: { $ref: "#/components/schemas/AuctionResult" } } } }
        "404": { description: Unknown auction }
  /v1/exchange/auctions/{auctionId}/execute:
    post:
      operationId: executeAward
      summary: Carry out the award over the rails (ADR-018) — escrow hold of B, silent failover with FR-15 slashing, principal release; once per auction
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/AuctionId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [merchantId], properties: { merchantId: { type: string, minLength: 1 } } } } } }
      responses:
        "200": { description: Execution outcome (repeat calls return the first outcome), content: { application/json: { schema: { $ref: "#/components/schemas/Execution" } } } }
        "400": { $ref: "#/components/responses/ExchangeError" }
        "404": { description: Unknown auction }
        "409": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/parties:
    post:
      operationId: registerParty
      summary: Register a merchant ("merchant:<id>") or carrier ("carrier:<name>") Ed25519 key for proofs of delivery
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, publicKey], properties: { name: { type: string, pattern: "^(merchant|carrier):.+$" }, publicKey: { type: string, contentEncoding: base64, description: X.509 SubjectPublicKeyInfo } } } } } }
      responses:
        "201": { description: Registered }
        "400": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/auctions/{auctionId}/fulfilment:
    post:
      operationId: submitFulfilment
      summary: FR-01 proof of delivery (signed merchant invoice for exactly A + signed carrier DELIVERED event); releases fee F, schedules yield Y
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/AuctionId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProofOfDelivery" } } } }
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Fulfilment" } } } }
        "409": { $ref: "#/components/responses/ExchangeError" }
        "422": { description: Proof rejected (problems listed), content: { application/json: { schema: { $ref: "#/components/schemas/Fulfilment" } } } }
  /v1/exchange/auctions/{auctionId}/sim/delivery:
    post:
      operationId: simulateDelivery
      summary: Dev and verification clusters only (difme.exchange.sim-parties) - the simulated merchant and carrier sign and submit the proof of delivery, checked like a real one
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/AuctionId" }]
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Fulfilment" } } } }
        "404": { description: Simulated parties are off }
        "409": { $ref: "#/components/responses/ExchangeError" }
        "422": { description: Proof rejected (problems listed), content: { application/json: { schema: { $ref: "#/components/schemas/Fulfilment" } } } }
  /v1/exchange/auctions/{auctionId}/returns:
    post:
      operationId: returnOrder
      summary: FR-01 buyer return inside the return window (full by default, or fractionBps of the order); two-leg refund
      description: "The merchant refunds A·r to the buying partner's card and the exchange claws it back; the buyer is refunded B·r at once (that A·r, the frozen yield Y·r from escrow and the reversed fee F·r). One return per order."
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/AuctionId" }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { fractionBps: { type: integer, minimum: 1, maximum: 10000, default: 10000 } } } } }
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  auctionId: { type: integer, format: int64 }
                  fractionBps: { type: integer }
                  buyerRefundMinor: { type: integer, format: int64 }
                  merchantRefundMinor: { type: integer, format: int64 }
                  partnerClawbackMinor: { type: integer, format: int64 }
                  yieldVoidedMinor: { type: integer, format: int64 }
                  feeReversedMinor: { type: integer, format: int64 }
                  escrow: { type: object }
        "400": { $ref: "#/components/responses/ExchangeError" }
        "409": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/auctions/{auctionId}/settle:
    post:
      operationId: settleYield
      summary: Release the yield Y to the buying partner once the pack's return window has passed
      security: [{ oauth2: [exchange:write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/AuctionId" }]
      responses:
        "200": { description: Escrow after release, content: { application/json: { schema: { type: object } } } }
        "409": { $ref: "#/components/responses/ExchangeError" }
  /v1/exchange/auctions/{auctionId}/evidence:
    get:
      operationId: getEvidence
      summary: The auction's hash-linked, Ed25519-sealed evidence chain and a fresh verification verdict
      security: [{ oauth2: [exchange:read] }]
      parameters: [{ $ref: "#/components/parameters/AuctionId" }]
      responses:
        "200": { description: Evidence chain, content: { application/json: { schema: { type: object, properties: { chain: { type: string }, sealed: { type: boolean }, artifacts: { type: array, items: { type: object } }, verdict: { type: object } } } } } }
        "404": { description: Unknown auction }
  /v1/exchange/keys:
    get:
      operationId: getEvidenceKeys
      summary: Public keys for independent verification of evidence seals (X.509 SubjectPublicKeyInfo, base64)
      security: [{ oauth2: [exchange:read] }]
      responses:
        "200": { description: Key name to key, content: { application/json: { schema: { type: object, additionalProperties: { type: string } } } } }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows: { clientCredentials: { tokenUrl: https://idp.difme.local/oauth2/token, scopes: { payments:write: create payments, payments:read: read payments, accounts:read: read accounts, exchange:write: open intents and mandates and bid and execute awards, exchange:read: read auctions and evidence } } }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: "#/components/schemas/Uuid7" }
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema: { type: string, pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$" }
    Pack:
      name: pack
      in: path
      required: true
      schema: { type: string, pattern: "^fr0[1-9]-[a-z]+$" }
    AuctionId:
      name: auctionId
      in: path
      required: true
      schema: { type: integer, format: int64, maximum: 9007199254740991 }
  schemas:
    Uuid7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1, description: Amount in minor units (no floats in money) }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    PaymentRequest:
      type: object
      required: [debitAccountId, creditAccountId, amount, channel]
      properties:
        debitAccountId: { $ref: "#/components/schemas/Uuid7" }
        creditAccountId: { $ref: "#/components/schemas/Uuid7" }
        amount: { $ref: "#/components/schemas/Money" }
        channel: { type: string, enum: [MOBILE, NFC_POS, WEB, BACK_OFFICE] }
        edgeFraudScore: { type: number, minimum: 0, maximum: 1 }
        attestationToken: { type: string, contentEncoding: base64, description: EAT (RFC 8392) evidence from the device TEE }
        crdtDelta: { type: string, contentEncoding: base64 }
    TransferRequest:
      allOf:
        - $ref: "#/components/schemas/PaymentRequest"
        - type: object
          required: [targetBank]
          properties:
            targetBank: { type: string, description: Destination bank identifier }
            beneficiaryReference: { type: string, maxLength: 140 }
    PaymentAccepted:
      type: object
      required: [paymentId, workflowId, status]
      properties:
        paymentId: { $ref: "#/components/schemas/Uuid7" }
        workflowId: { type: string }
        status: { type: string, enum: [ACCEPTED, DUPLICATE] }
    Payment:
      type: object
      required: [paymentId, status, amount]
      properties:
        paymentId: { $ref: "#/components/schemas/Uuid7" }
        status: { type: string, enum: [ACCEPTED, DEBITED, SETTLEMENT_RESERVED, NOTIFIED, CREDITED, COMPLETED, COMPENSATED, REJECTED] }
        amount: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }
    Account:
      type: object
      properties:
        accountId: { $ref: "#/components/schemas/Uuid7" }
        holderName: { type: string }
        kycStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        region: { type: string }
    Balance:
      type: object
      properties:
        accountId: { $ref: "#/components/schemas/Uuid7" }
        postedMinor: { type: integer, format: int64 }
        pendingMinor: { type: integer, format: int64 }
        currency: { type: string }
    ExchangeIntent:
      type: object
      required: [riskScore, listMinor, discountBps, feeMinor, maxPriceMinor]
      properties:
        riskScore: { type: number, minimum: 0, maximum: 1000 }
        offerSanctioned: { type: boolean }
        listMinor: { type: integer, format: int64, minimum: 1 }
        discountBps: { type: integer, minimum: 1, maximum: 9999 }
        feeMinor: { type: integer, format: int64, minimum: 0 }
        maxPriceMinor: { type: integer, format: int64, minimum: 1 }
        fraudFeatures:
          description: "PDF §11.1 FAIL path: edge attestation failed, so the exchange scores these server-side (services/fraud-scorer) and that score replaces riskScore. When the scorer can't answer, 422 with finding RISK_UNSCORED (fails closed)."
          type: object
          required: [amountZscore, txnCount1h, distinctCounterparties24h, geoJumpKm1h, newDeviceFlag, edgeScoreMean24h]
          properties:
            amountZscore: { type: number }
            txnCount1h: { type: number, minimum: 0 }
            distinctCounterparties24h: { type: number, minimum: 0 }
            geoJumpKm1h: { type: number, minimum: 0 }
            newDeviceFlag: { type: number, enum: [0, 1] }
            edgeScoreMean24h: { type: number, minimum: 0, maximum: 1000 }
    IntentOpened:
      type: object
      properties:
        auctionId: { type: integer, format: int64 }
        maxYieldMinor: { type: integer, format: int64, description: "Y_max = d·P − F − 1" }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        riskSource: { type: string, description: "edge (client score) or server:<model> (§11.1 FAIL path)" }
        standingBids: { type: integer, minimum: 0, description: "Bids the exchange placed for standing mandates when the intent opened" }
    MandateState:
      type: object
      properties:
        mandateId: { type: integer, format: int64 }
        partnerRef: { type: string }
        nodeRef: { type: integer }
        standing: { type: boolean, description: "Within validity and with budget left: bids automatically" }
        budgetTotalMinor: { type: integer, format: int64 }
        budgetLeftMinor: { type: integer, format: int64 }
        awards: { type: integer, minimum: 0 }
        yieldEarnedMinor: { type: integer, format: int64 }
        minYieldPct: { type: number }
        ageDays: { type: integer, minimum: 0 }
        validityDays: { type: integer }
        tier: { type: string, enum: [COLD_START, ESTABLISHED, ENTERPRISE] }
    Finding:
      type: object
      properties: { code: { type: string }, severity: { type: string, enum: [BLOCK, WARN, INFO] }, message: { type: string } }
    Mandate:
      type: object
      required: [partnerRef, limitMinor, maxPerOrderMinor, budgetTotalMinor, validityDays]
      properties:
        partnerRef: { type: string }
        limitMinor: { type: integer, format: int64 }
        maxPerOrderMinor: { type: integer, format: int64 }
        minYieldPct: { type: number, minimum: 0 }
        depositMinor: { type: integer, format: int64 }
        budgetTotalMinor: { type: integer, format: int64 }
        merchantCount: { type: integer }
        goodsCount: { type: integer }
        validityDays: { type: integer }
        cardJurisdiction: { type: string }
    MandateRegistered:
      type: object
      properties:
        mandateId: { type: integer, format: int64 }
        depositRequiredMinor: { type: integer, format: int64 }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
    Bid:
      type: object
      required: [nodeRef, askMinor, reputation, latencyMicros]
      properties:
        nodeRef: { type: integer }
        askMinor: { type: integer, format: int64, description: Yield Y asked by the buying partner }
        reputation: { type: number, minimum: 0, maximum: 100 }
        latencyMicros: { type: integer, format: int64 }
        partner:
          type: object
          properties:
            flow: { type: string, enum: [A, B, C] }
            intentAgeDays: { type: integer }
            depositMinor: { type: integer, format: int64 }
            budgetLeftMinor: { type: integer, format: int64 }
            merchantApproved: { type: boolean }
            goodsInScope: { type: boolean }
            maxPerOrderMinor: { type: integer, format: int64 }
            validityDays: { type: integer }
            mandateId: { type: integer, format: int64 }
    AuctionResult:
      type: object
      properties:
        auctionId: { type: integer, format: int64 }
        status: { type: string, enum: [OPEN] }
        pack: { type: string }
        ranked: { type: integer }
        top: { type: array, items: { type: object, properties: { nodeRef: { type: integer }, askMinor: { type: integer, format: int64 }, score: { type: number } } } }
        award:
          type: object
          properties:
            collateralMinor: { type: integer, format: int64 }
            tier: { type: string, enum: [COLD_START, ESTABLISHED, ENTERPRISE], description: "the winner's tier from its delivery history (FR-14 φ)" }
            split: { type: object, description: "Conservation identity: A = P − d·P; B = A + Y + F; buyer saves P − B", additionalProperties: { type: integer, format: int64 } }
    Execution:
      type: object
      properties:
        auctionId: { type: integer, format: int64 }
        merchantId: { type: string }
        boughtBy: { type: integer, format: int64, description: "-1 when no partner could buy" }
        fulfilled: { type: boolean }
        slashedMinor: { type: integer, format: int64 }
        attempts:
          type: array
          items:
            type: object
            properties:
              partnerId: { type: integer, format: int64 }
              responseCode: { type: string, description: ISO 8583 field 39 }
              outcome: { type: string, enum: [APPROVED, DECLINE_FUNDS, DECLINE_OTHER, RETRYABLE] }
              slashMinor: { type: integer, format: int64 }
        escrow:
          type: object
          properties:
            holdId: { type: string }
            heldMinor: { type: integer, format: int64 }
            releasedMinor: { type: integer, format: int64 }
            refundedMinor: { type: integer, format: int64 }
            state: { type: string, enum: [HELD, PARTLY_RELEASED, SETTLED, REFUNDED] }
    ProofOfDelivery:
      type: object
      required: [invoice, delivery]
      properties:
        invoice:
          type: object
          required: [invoiceId, merchantId, auctionId, amountMinor, currency, signature]
          properties:
            invoiceId: { type: string }
            merchantId: { type: string }
            auctionId: { type: integer, format: int64 }
            amountMinor: { type: integer, format: int64 }
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            signature: { type: string, contentEncoding: base64, description: Ed25519 over the canonical JSON of the other fields }
        delivery:
          type: object
          required: [carrier, trackingId, auctionId, status, deliveredAtMs, signature]
          properties:
            carrier: { type: string }
            trackingId: { type: string }
            auctionId: { type: integer, format: int64 }
            status: { type: string, enum: [DELIVERED, IN_TRANSIT, RETURNED] }
            deliveredAtMs: { type: integer, format: int64 }
            signature: { type: string, contentEncoding: base64 }
    Fulfilment:
      type: object
      properties:
