# PDF §5.5 event broker → Apache Kafka 4 KRaft (ADR-001). No ZooKeeper.
# Day-0 history: infinite retention + the Flink→Iceberg archive (ADR-006 covers the tiered-storage plugin choice).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata: { name: dual, labels: { strimzi.io/cluster: difme } }
spec:
  replicas: 1                        # redpanda-0/1/2 → 3 in production overlay
  roles: [controller, broker]
  storage: { type: jbod, volumes: [{ id: 0, type: persistent-claim, size: 8Gi, kraftMetadata: shared }] }
  resources: { requests: { cpu: 200m, memory: 1Gi }, limits: { memory: 1536Mi } }
  jvmOptions: { "-Xms": 512m, "-Xmx": 768m }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
# Strimzi names services <cluster>-kafka-bootstrap, so cluster "difme" gives the difme-kafka-bootstrap every client uses.
metadata: { name: difme, annotations: { strimzi.io/node-pools: enabled, strimzi.io/kraft: enabled } }
spec:
  kafka:
    version: 4.2.0
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
      - { name: tls, port: 9093, type: internal, tls: true, authentication: { type: tls } }
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    metricsConfig: { type: jmxPrometheusExporter, valueFrom: { configMapKeyRef: { name: kafka-metrics, key: kafka-metrics-config.yml } } }
  entityOperator: { topicOperator: {}, userOperator: {} }
