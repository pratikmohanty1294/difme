# PDF §6.1 — Temporal OSS durable execution. Persistence on the shared platform Postgres (ADR-019): Temporal does
# not support YugabyteDB (its visibility schema needs multi-column GIN indexes; found live).
server:
  # Tier 2 memory (Go): GC at +50% heap growth instead of +100%; Temporal services are mostly idle in the Codespace.
  additionalEnv: [{ name: GOGC, value: "50" }]
  replicaCount: 1
  config:
    # Chart default is 512 history shards; each shard keeps its own caches, queues and timers in temporal-history.
    # Dev runs one history pod with a handful of workflows, so 4 shards. The count is fixed when the database is first
    # set up and can't be changed later: production must set its own (512+) before its first install.
    numHistoryShards: 4
    persistence:
      default:
        driver: sql
        sql: { driver: postgres12, host: postgres-docdb.database-tier.svc, port: 5432, database: temporal, user: temporal, existingSecret: temporal-db, maxConns: 20 }
      visibility:
        driver: sql
        sql: { driver: postgres12, host: postgres-docdb.database-tier.svc, port: 5432, database: temporal_visibility, user: temporal, existingSecret: temporal-db, maxConns: 10 }
    # The schema job also registers the namespace the services use (otherwise cmd-svc/saga-orchestrator fail with
    # "Namespace default is not found" on a fresh database; found live). Retention 3d keeps visibility rows small.
    namespaces: { create: true, namespace: [{ name: default, retention: 3d }] }
  frontend: { resources: { requests: { cpu: 50m, memory: 128Mi } } }
  history:  { replicaCount: 1, resources: { requests: { cpu: 100m, memory: 256Mi } } }   # ×3 in production overlay
  matching: { resources: { requests: { cpu: 50m, memory: 128Mi } } }
  worker:   { resources: { requests: { cpu: 50m, memory: 128Mi } } }
  metrics: { serviceMonitor: { enabled: false }, annotations: { enabled: true } }
cassandra: { enabled: false }
mysql: { enabled: false }
postgresql: { enabled: false }
elasticsearch: { enabled: false }
prometheus: { enabled: false }
grafana: { enabled: false }
web: { enabled: true, resources: { requests: { cpu: 20m, memory: 64Mi } } }
# The platform Postgres init script creates the temporal databases; the temporal role has no CREATEDB privilege by design (found live:
# "permission denied to create database"), so the chart only sets up and updates the schema.
schema: { createDatabase: { enabled: false }, setup: { enabled: true }, update: { enabled: true } }
