# PDF §8 — double-entry ledger, strict ACID. Single replica in the Codespace; 3/6 replicas via overlays.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: tigerbeetle, namespace: database-tier, labels: { app: tigerbeetle } }
spec:
  serviceName: tigerbeetle
  replicas: 1
  selector: { matchLabels: { app: tigerbeetle } }
  template:
    metadata: { labels: { app: tigerbeetle } }
    spec:
      initContainers:
        - name: format
          image: ghcr.io/tigerbeetle/tigerbeetle:0.16.78
          command: [sh, -c, "[ -f /data/0_0.tigerbeetle ] || /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle"]
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:0.16.78
          # Dev sizing, measured 2026-11-20 on 0.16.78 (RSS right after start, throwaway instance; owner rule: optimise
          # for memory). Old flags: 2151 MiB. --development (smaller batch size and default buffers; also on format):
          # 1641. + --memory-lsm-manifest=1MiB and --cache-grid=32MiB: 1415. + object caches 8/8/4 MiB: 1358 MiB.
          # Floor without object caches: 1334 MiB (static message pool and journal). Not tried: --limit-request
          # (raises memory under --development). Production overlays drop --development and raise the caches.
          args: [start, --addresses=0.0.0.0:3000, --experimental, --development, --memory-lsm-manifest=1MiB,
                 --cache-grid=32MiB, --cache-accounts=8MiB, --cache-transfers=8MiB, --cache-transfers-pending=4MiB,
                 /data/0_0.tigerbeetle]
          ports: [{ containerPort: 3000 }]
          resources: { requests: { cpu: 200m, memory: 1400Mi }, limits: { memory: 1536Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: tigerbeetle, namespace: database-tier }
spec: { selector: { app: tigerbeetle }, ports: [{ port: 3000 }] }
