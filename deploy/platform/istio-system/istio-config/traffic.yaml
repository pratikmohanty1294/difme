# PDF §4.4 — canary 10/90, circuit breaker (50% errors → open 10s), 3 retries with exponential backoff on 5xx.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: { name: quarkus-cmd-svc, namespace: core-platform }
spec:
  host: quarkus-cmd-svc.core-platform.svc.cluster.local
  subsets: [{ name: stable, labels: { version: stable } }, { name: canary, labels: { version: canary } }]
  trafficPolicy:
    connectionPool: { http: { http2MaxRequests: 1000, maxRequestsPerConnection: 100 } }
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 5s
      baseEjectionTime: 10s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: quarkus-cmd-svc, namespace: core-platform }
spec:
  hosts: [quarkus-cmd-svc.core-platform.svc.cluster.local]
  http:
    - retries: { attempts: 3, perTryTimeout: 2s, retryOn: "5xx,reset,connect-failure" }
      route:
        - { destination: { host: quarkus-cmd-svc.core-platform.svc.cluster.local, subset: stable }, weight: 90 }
        - { destination: { host: quarkus-cmd-svc.core-platform.svc.cluster.local, subset: canary }, weight: 10 }
