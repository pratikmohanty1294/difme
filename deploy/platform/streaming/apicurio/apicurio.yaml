# PDF §5.10 — Apicurio Registry: OpenAPI, AsyncAPI, Avro, Protobuf, GraphQL artifacts; PostgreSQL-compatible
# storage on YugabyteDB (linearizable per schema, §14).
apiVersion: apps/v1
kind: Deployment
metadata: { name: apicurio-registry, labels: { app: apicurio-registry } }
spec:
  replicas: 1
  selector: { matchLabels: { app: apicurio-registry } }
  template:
    metadata: { labels: { app: apicurio-registry } }
    spec:
      containers:
        - name: registry
          image: quay.io/apicurio/apicurio-registry:3.3.4
          env:
            - { name: QUARKUS_HTTP_PORT, value: "8081" }
            # Low-footprint JVM profile (Tier 2): schema registry, not on the payment path.
            # The image's run-java already sets a GC (ParallelGC); a second one in JAVA_OPTS_APPEND stops the JVM
            # ("multiple GCs", found live), so the GC is replaced through GC_CONTAINER_OPTIONS instead.
            - { name: GC_CONTAINER_OPTIONS, value: "-XX:+UseSerialGC" }
            - { name: JAVA_OPTS_APPEND, value: "-XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=24m -XX:MaxMetaspaceSize=96m -Xss256k" }
            - { name: MALLOC_ARENA_MAX, value: "2" }   # the UI image listens on 8080 in 3.x; they share the pod
            - { name: APICURIO_STORAGE_KIND, value: sql }
            - { name: APICURIO_STORAGE_SQL_KIND, value: postgresql }
            - { name: APICURIO_DATASOURCE_URL, value: "jdbc:postgresql://yb-tservers.database-tier.svc:5433/apicurio" }
            - { name: APICURIO_DATASOURCE_USERNAME, value: apicurio }   # role from db-init; without it the image defaults to "sa"
            - { name: APICURIO_REST_DELETION_ARTIFACT_ENABLED, value: "false" }
            - { name: APICURIO_RULES_GLOBAL_COMPATIBILITY, value: BACKWARD_TRANSITIVE }
            - { name: APICURIO_RULES_GLOBAL_VALIDITY, value: FULL }
          ports: [{ containerPort: 8081 }]
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
        - name: ui
          image: quay.io/apicurio/apicurio-registry-ui:3.3.4
          env: [{ name: REGISTRY_API_URL, value: "http://localhost:8081/apis/registry/v3" }]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: apicurio-registry }
spec: { selector: { app: apicurio-registry }, ports: [{ name: api, port: 8080, targetPort: 8081 }, { name: ui, port: 8888, targetPort: 8080 }] }
