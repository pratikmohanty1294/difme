# ADR-011 benchmark: 10,000,000-record CSV, every record validated against linked records in PostgreSQL
# (batched lookups) and the payment-limits DMN. Publishes the measured throughput; target ≤ 300 s.
name: bulk-benchmark
on:
  push: { branches: [main], paths: ["analytics/flink-jobs/**", ".github/workflows/bulk-benchmark.yml"] }
  workflow_dispatch:
    inputs:
      records: { description: "records", default: "10000000" }
permissions: { contents: read }
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: difme, POSTGRES_PASSWORD: bench, POSTGRES_DB: difme }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U difme" --health-interval 5s --health-retries 20
    env:
      RECORDS: ${{ github.event.inputs.records || '10000000' }}
      ACCOUNTS: "1000000"
      PGPASSWORD: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Seed linked records (1M accounts, statuses, prior refs)
        run: |
          psql -h localhost -U difme -d difme -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA bulk_ref;
          CREATE TABLE bulk_ref.account (account_id text PRIMARY KEY, currency char(3) NOT NULL, risk_level text NOT NULL);
          CREATE TABLE bulk_ref.account_status (account_id text PRIMARY KEY, status text NOT NULL);
          CREATE TABLE bulk_ref.processed_ref (external_ref text PRIMARY KEY);
          INSERT INTO bulk_ref.account SELECT 'ACC' || g, 'INR', CASE WHEN g % 10 = 0 THEN 'HIGH' WHEN g % 3 = 0 THEN 'MEDIUM' ELSE 'LOW' END FROM generate_series(0, 999999) g;
          INSERT INTO bulk_ref.account_status SELECT 'ACC' || g, CASE WHEN g % 500 = 0 THEN 'FROZEN' ELSE 'ACTIVE' END FROM generate_series(0, 999999) g;
          INSERT INTO bulk_ref.processed_ref SELECT 'REF' || g FROM generate_series(0, 9999) g;
          ANALYZE;
          SQL
      - name: Build
        run: mvn -B -ntp -q -f analytics/flink-jobs/pom.xml package -DskipTests
      - name: Generate input file
        working-directory: analytics/flink-jobs
        run: |
          mvn -B -ntp -q exec:java -Dexec.classpathScope=test -Dexec.mainClass=dev.difme.flink.bulk.GenerateFile \
            -Dexec.args="/tmp/bench.csv ${RECORDS} ${ACCOUNTS}"
          ls -lh /tmp/bench.csv
      - name: Run bulk validation
        working-directory: analytics/flink-jobs
        run: |
          start=$(date +%s)
          # Separate JVM (exec:exec): Flink's embedded cluster can't deserialize user code inside Maven's classloader.
          mvn -B -ntp -q exec:exec -Dexec.executable=java -Dexec.classpathScope=test \
            -Dexec.args="-Xmx10g -XX:+UseParallelGC -cp %classpath dev.difme.flink.bulk.BulkFileJob --local true --managed-memory 3g --parallelism 4 --input file:///tmp/bench.csv --out-dir file:///tmp/bench-out --valid-sink discard --dmn-file ../../processes/dmn/payment-limits.dmn --jdbc-url jdbc:postgresql://localhost:5432/difme --jdbc-user difme --jdbc-password bench --batch 1000"
          end=$(date +%s)
          secs=$((end - start))
          report=$(cat /tmp/bench-out/report/*/* 2>/dev/null || find /tmp/bench-out/report -type f -exec cat {} +)
          rps=$((RECORDS / (secs > 0 ? secs : 1)))
          verdict=$([ "$secs" -le 300 ] && echo "✅ within 5-minute target" || echo "⚠️ over 5-minute target on this runner")
          {
            echo "## Bulk file benchmark (ADR-011)"
            echo "| Records | Seconds | Records/s | Result |"
            echo "|---|---|---|---|"
            echo "| ${RECORDS} | ${secs} | ${rps} | ${verdict} |"
            echo
            echo "Runner: GitHub-hosted ubuntu-24.04 (4 vCPU / 16 GB), PostgreSQL 17 service container, parallelism 4."
            echo "Report: \`${report}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "records=${RECORDS} seconds=${secs} rps=${rps} report=${report}"
