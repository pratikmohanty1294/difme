# Example ingestion job: external partner account feed (JDBC) → Iceberg via the Polaris REST catalog.
env { parallelism = 1, job.mode = "BATCH" }
source {
  Jdbc {
    url = "jdbc:postgresql://partner-db.example.invalid:5432/partners"
    driver = "org.postgresql.Driver"
    user = "${PARTNER_DB_USER}"
    password = "${PARTNER_DB_PASSWORD}"
    query = "SELECT account_id, holder_name, kyc_status, region, updated_at FROM accounts"
  }
}
sink {
  Iceberg {
    catalog_name = "difme"
    iceberg.catalog.config = {
      type = "rest"
      uri = "http://polaris.lakehouse.svc:8181/api/catalog"
      warehouse = "difme"
    }
    namespace = "external"
    table = "partner_accounts"
  }
}
