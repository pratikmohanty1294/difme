# PDF §11.2 — every DIFME image must be cosign-signed by the reusable image pipeline and carry SLSA provenance.
# The signing identity is the reusable workflow itself, so a build from any other workflow is rejected.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: require-signed-images }
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 15
  rules:
    - name: verify-signature-and-provenance
      match: { any: [{ resources: { kinds: [Pod] } }] }
      verifyImages:
        - imageReferences: ["ghcr.io/pratikmohanty1294/difme-*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/pratikmohanty1294/difme/.github/workflows/_image.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor: { url: https://rekor.sigstore.dev }
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        subject: "https://github.com/pratikmohanty1294/difme/.github/workflows/_image.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
            - type: https://spdx.dev/Document/v2.3
              attestors:
                - entries:
                    - keyless:
                        subject: "https://github.com/pratikmohanty1294/difme/.github/workflows/_image.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
