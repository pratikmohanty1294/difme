quarkus.application.name=quarkus-qry-svc
quarkus.http.port=8081

# EVENTUAL reads from YugabyteDB follower replicas (PDF §5.4 / §14): read-only sessions, follower reads on.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://yb-tservers.database-tier.svc:5433/difme}
quarkus.datasource.username=${DB_USER:difme_reader}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.new-connection-sql=SET yb_read_from_followers = true; SET default_transaction_read_only = true; SET yb_follower_read_staleness_ms = 30000
quarkus.datasource.jdbc.max-size=30
quarkus.mybatis.map-underscore-to-camel-case=true

# Back-office read sources (PDF §5.9). Excluded from readiness so the core read path never depends on them.
quarkus.datasource."risingwave".db-kind=postgresql
quarkus.datasource."risingwave".jdbc.url=${RISINGWAVE_URL:jdbc:postgresql://risingwave.streaming.svc:4567/dev}
quarkus.datasource."risingwave".username=root
quarkus.datasource."risingwave".jdbc.min-size=0
quarkus.datasource."risingwave".health-exclude=true
quarkus.datasource."trino".db-kind=other
quarkus.datasource."trino".jdbc.driver=io.trino.jdbc.TrinoDriver
quarkus.datasource."trino".jdbc.url=${TRINO_URL:jdbc:trino://trino.lakehouse.svc:8080/iceberg}
quarkus.datasource."trino".username=qry-svc
quarkus.datasource."trino".jdbc.min-size=0
quarkus.datasource."trino".health-exclude=true
quarkus.datasource."starrocks".db-kind=mariadb
quarkus.datasource."starrocks".jdbc.url=${STARROCKS_URL:jdbc:mariadb://kube-starrocks-fe-service.lakehouse.svc:9030/}
quarkus.datasource."starrocks".username=${STARROCKS_USER:root}
quarkus.datasource."starrocks".password=${STARROCKS_PASSWORD:}
quarkus.datasource."starrocks".jdbc.min-size=0
quarkus.datasource."starrocks".health-exclude=true

quarkus.redis.hosts=${VALKEY_URL:redis://valkey.cache-tier.svc:6379}
difme.cache.l1.max-size=100000
difme.cache.l1.ttl=PT5M
difme.cache.l2.ttl=PT1H

difme.tigerbeetle.cluster-id=0
difme.tigerbeetle.addresses=${TB_ADDRESSES:tigerbeetle.database-tier.svc:3000}

quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc:4317}
quarkus.micrometer.export.prometheus.path=/q/metrics
