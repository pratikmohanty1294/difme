quarkus.http.port=8089
quarkus.application.name=exchange-svc
# Vertical packs served by this instance (verticals/<id> on the classpath). Only live packs have rules.
difme.exchange.packs=fr01-buy
# Matching engine sizing per pack: concurrent auctions x bids per auction, preallocated at start.
difme.exchange.max-auctions=4096
difme.exchange.bids-per-auction=256
difme.exchange.ring-bytes=4194304
# Closed auctions kept for GET (oldest evicted first).
difme.exchange.results-kept=100000
quarkus.micrometer.binder.http-server.match-patterns=/v1/exchange/auctions/[0-9]+=/v1/exchange/auctions/{id}
# Server-side fraud scorer (services/fraud-scorer, ml profile) for intents that carry raw features (PDF 11.1 FAIL path).
# Not running → those intents get 422 RISK_UNSCORED (fail closed); intents with an edge score are unaffected.
difme.exchange.fraud-scorer-url=http://onnx-serving.ml-platform.svc:8090
