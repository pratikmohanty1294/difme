apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8ssandra-operator
  namespace: argocd
  labels:
    difme/profile: data
    difme/pdf-section: '8'
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: database-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://helm.k8ssandra.io/stable
    chart: k8ssandra-operator
    targetRevision: 1.21.1
    helm:
      releaseName: k8ssandra-operator
      valueFiles:
      - $values/deploy/platform/database-tier/k8ssandra-operator/values.yaml
  - repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    ref: values
