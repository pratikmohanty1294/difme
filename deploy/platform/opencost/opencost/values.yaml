# PDF §16 — per-namespace, per-workload, per-transaction cost attribution.
opencost:
  exporter:
    defaultClusterId: difme-codespace
    resources: { requests: { cpu: 20m, memory: 64Mi } }
  customPricing:
    enabled: true
    provider: custom
    costModel: { description: "Codespace on-demand equivalent", CPU: "0.031611", RAM: "0.004237", storage: "0.00005" }
  prometheus:
    internal: { enabled: true, serviceName: vmsingle-victoria-metrics-k8s-stack, namespaceName: observability, port: 8429 }
  ui: { enabled: true }
  # The chart sets EMIT_*_ANNOTATIONS_METRIC from these; setting them again via extraEnv duplicated the env keys.
  metrics: { kubeStateMetrics: { emitPodAnnotations: true, emitNamespaceAnnotations: true } }
