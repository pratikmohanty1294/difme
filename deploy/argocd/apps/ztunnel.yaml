apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: argocd
  labels:
    difme/profile: security
    difme/pdf-section: '4.4'
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://istio-release.storage.googleapis.com/charts
    chart: ztunnel
    targetRevision: 1.25.1
    helm:
      releaseName: ztunnel
      valueFiles:
      - $values/deploy/platform/istio-system/ztunnel/values.yaml
  - repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    ref: values
