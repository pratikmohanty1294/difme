# PDF §5.8 — OPA Rego policy-as-code at admission.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: { name: difmeallowedregistries }
spec:
  crd: { spec: { names: { kind: DifmeAllowedRegistries }, validation: { openAPIV3Schema: { type: object, properties: { registries: { type: array, items: { type: string } } } } } } }
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package difmeallowedregistries
        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          not startswith_any(c.image, input.parameters.registries)
          msg := sprintf("image %v is not from an allowed registry", [c.image])
        }
        startswith_any(img, prefixes) { startswith(img, prefixes[_]) }
---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: { name: difmenoplaintextsecrets }
spec:
  crd: { spec: { names: { kind: DifmeNoPlaintextSecrets } } }
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package difmenoplaintextsecrets
        # Credentials must come from OpenBao (agent injector / CSI), never literal env values.
        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          e := c.env[_]
          regex.match("(?i)(password|secret|token|api_key)", e.name)
          e.value
          msg := sprintf("env %v in %v must come from OpenBao, not a literal", [e.name, c.name])
        }
