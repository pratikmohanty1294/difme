# Iceberg table maintenance. event-archive commits every 2 s (E2E < 3 s requirement), which writes many small files;
# hourly compaction keeps scans fast. The archive tables are append-only, so the state "as of" any time is just the rows
# up to that time: snapshots older than 7 days (Trino's minimum) are not needed for audit and are expired, with their
# orphaned files. Uses the coordinator's image (already on the node), and skips tables that don't exist yet.
apiVersion: batch/v1
kind: CronJob
metadata: { name: iceberg-maintenance }
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: maintain
              image: trinodb/trino:470
              command: [/bin/bash, -c]
              args:
                - |
                  set -u
                  q() { trino --server http://trino.lakehouse.svc:8080 --user iceberg-maintenance --execute "$1"; }
                  for t in payment_events fraud_alerts; do
                    if q "SELECT 1 FROM iceberg.events.\"$t\$snapshots\" LIMIT 1" >/dev/null 2>&1; then
                      q "ALTER TABLE iceberg.events.$t EXECUTE optimize(file_size_threshold => '64MB')" &&
                      q "ALTER TABLE iceberg.events.$t EXECUTE expire_snapshots(retention_threshold => '7d')" &&
                      q "ALTER TABLE iceberg.events.$t EXECUTE remove_orphan_files(retention_threshold => '7d')" &&
                      echo "maintained $t" || { echo "maintenance failed for $t"; exit 1; }
                    else
                      echo "skip $t (not created yet)"
                    fi
                  done
              resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 512Mi } }
