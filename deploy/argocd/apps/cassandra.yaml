apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cassandra
  namespace: argocd
  labels:
    difme/profile: data
    difme/pdf-section: '8'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: database-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    path: deploy/platform/database-tier/cassandra
