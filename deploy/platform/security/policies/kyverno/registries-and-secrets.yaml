# ADR-015: the two former Gatekeeper constraints, as Kyverno rules (one admission engine instead of three).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: restrict-registries }
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: difme-workloads-use-difme-images
      match: { any: [{ resources: { kinds: [Pod], namespaces: [core-platform, quinn-hub, back-office-ui] } }] }
      validate:
        message: "Images in DIFME service namespaces must come from the DIFME registry (signed by the image pipeline)."
        pattern:
          spec:
            containers: [{ image: "ghcr.io/pratikmohanty1294/* | harbor.difme.local/*" }]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: no-plaintext-secrets }
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: secret-like-env-must-reference-a-secret
      match: { any: [{ resources: { kinds: [Pod], namespaces: [core-platform, quinn-hub, back-office-ui, ml-platform, streaming, process, forms] } }] }
      validate:
        message: "Credential-like environment variables must use valueFrom (OpenBao / Kubernetes Secret), never a literal value."
        pattern:
          spec:
            containers:
              - =(env):
                  - (name): "*PASSWORD* | *SECRET* | *TOKEN* | *API_KEY* | *password* | *secret* | *token* | *api_key*"
                    X(value): "null"
