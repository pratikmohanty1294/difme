apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-controller
  namespace: argocd
  labels:
    difme/profile: base
    difme/pdf-section: '11.2'
  annotations:
    argocd.argoproj.io/sync-wave: '-7'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://sigstore.github.io/helm-charts
    chart: policy-controller
    targetRevision: 0.10.0
    helm:
      releaseName: policy-controller
      valueFiles:
      - $values/deploy/platform/security/policy-controller/values.yaml
  - repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    ref: values
