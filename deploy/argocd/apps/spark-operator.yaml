apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-operator
  namespace: argocd
  labels:
    difme/profile: lakehouse
    difme/pdf-section: '5.6'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://kubeflow.github.io/spark-operator
    chart: spark-operator
    targetRevision: 2.1.1
    helm:
      releaseName: spark-operator
      valueFiles:
      - $values/deploy/platform/lakehouse/spark-operator/values.yaml
  - repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    ref: values
