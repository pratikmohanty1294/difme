# ADR-008 — MongoDB wire protocol on PostgreSQL (Apache-2.0), replacing SSPL MongoDB for formio.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ferretdb, labels: { app: ferretdb } }
spec:
  replicas: 1
  selector: { matchLabels: { app: ferretdb } }
  template:
    metadata: { labels: { app: ferretdb } }
    spec:
      containers:
        - name: ferretdb
          image: ghcr.io/ferretdb/ferretdb:2.7.0
          env:
            - name: FERRETDB_POSTGRESQL_URL
              valueFrom: { secretKeyRef: { name: ferretdb, key: postgresql-url } }   # postgres://difme:…@postgres-docdb.database-tier.svc:5432/postgres
            - { name: FERRETDB_TELEMETRY, value: disable }
          ports: [{ name: mongo, containerPort: 27017 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ferretdb }
spec: { selector: { app: ferretdb }, ports: [{ name: mongo, port: 27017 }] }
