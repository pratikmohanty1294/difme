# PDF §4.6 — eBPF kube-proxy replacement, WireGuard pod-to-pod encryption, Hubble L7 flow logs.
# Codespace (k3d, Kubernetes-in-Docker): Cilium runs alongside kube-proxy; ADR-013. Real clusters (RKE2 on VMs or
# bare metal, deploy/fleet/rke2-config.yaml) set kubeProxyReplacement: true for the full eBPF data path (PDF §4.6).
kubeProxyReplacement: false
# Single-server k3d: the agent and operator use the host network, and the API server listens on the node itself.
# The node IP changes when the Codespace restarts (found live), so a fixed IP breaks all pod networking.
# Multi-node overlays set this to the API load-balancer name instead.
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
loadBalancer: { algorithm: maglev }
bpf:
  masquerade: false   # BPF masquerade needs NodePort/KPR; iptables masquerade alongside kube-proxy (ADR-013, verified live)
  # Kubernetes-in-Docker (k3d in Codespaces) can't use eBPF host routing: pods could not reach the API service.
  # Verified on the first live run (2026-11-17). Bare-metal / VM overlays set this to false for full eBPF routing.
  hostLegacyRouting: true
socketLB: { enabled: false }
# Istio ambient chains its istio-cni plugin into Cilium's conflist; with the default exclusive=true Cilium deletes the
# entry and istio-cni never turns ready (cluster-verify 2026-11-20: only 05-cilium.conflist, readiness 503 for 50 min).
cni: { exclusive: false }
# Pod addresses: the node runs up to 240 pods (kubelet maxPods, deploy/bootstrap/kubelet-difme.conf), so each node gets a
# /23 (510 addresses) instead of the default /24.
ipam: { operator: { clusterPoolIPv4MaskSize: 23 } }
encryption: { enabled: true, type: wireguard }
hubble:
  enabled: true
  relay: { enabled: true }
  ui: { enabled: true }
  metrics:
    enabled: [dns, drop, tcp, flow, "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,destination_namespace"]
    serviceMonitor: { enabled: false }
operator: { replicas: 1 }
resources: { requests: { cpu: 100m, memory: 256Mi } }
