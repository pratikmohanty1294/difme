# Reusable image pipeline (PDF §4.5, §11.2). Running every build inside one reusable workflow isolates the
# build from the caller, which gives SLSA Build Level 3 provenance via GitHub artifact attestations.
# Steps: prebuild → buildx push → Trivy (CRITICAL blocks) → Syft SBOM attestation → cosign keyless sign → SLSA provenance.
name: _image
on:
  workflow_call:
    inputs:
      name:        { type: string, required: true }    # image name without registry, e.g. difme-cmd-svc
      context:     { type: string, default: "." }
      dockerfile:  { type: string, required: true }
      build-args:  { type: string, default: "" }
      java:        { type: boolean, default: false }
      node:        { type: boolean, default: false }
      prebuild:    { type: string, default: "true" }
      version:     { type: string, default: "0.1.0" }
    outputs:
      digest: { value: "${{ jobs.image.outputs.digest }}" }

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { digest: "${{ steps.push.outputs.digest }}" }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.java
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - if: inputs.node
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Prebuild
        run: ${{ inputs.prebuild }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build (local) for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          load: true
          tags: ${{ env.IMAGE }}:scan
      - name: Trivy — CRITICAL vulnerabilities block promotion
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.59.1             image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "${IMAGE}:scan"
      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Syft SBOM
        uses: anchore/sbom-action@v0
        with: { image: "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}", format: spdx-json, output-file: sbom.spdx.json, upload-artifact: true }
      - name: Attest SBOM (stored next to the image)
        uses: actions/attest-sbom@v2
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", sbom-path: sbom.spdx.json, push-to-registry: true }
      - uses: sigstore/cosign-installer@v3
      - name: Cosign keyless signature
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: SLSA provenance (Build L3 via reusable workflow)
        id: provenance
        uses: actions/attest-build-provenance@v2
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", push-to-registry: true }
      # Kyverno verifyImages reads cosign-format attestations, not the Sigstore-bundle referrers written above
      # (found by a server dry run on the live cluster). Publish both, signed by this same workflow identity.
      - name: Cosign attestations for admission control (SLSA provenance + SPDX SBOM)
        run: |
          REF="${IMAGE}@${{ steps.push.outputs.digest }}"
          jq -r '.dsseEnvelope.payload' "${{ steps.provenance.outputs.bundle-path }}" | base64 -d | jq '.predicate' > provenance.json
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
