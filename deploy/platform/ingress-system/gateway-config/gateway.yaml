apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: { name: difme-proxy, namespace: ingress-system }
spec:
  # One worker thread (dev sizing, owner memory rule): Envoy defaults to one per CPU, and every worker carries its own
  # Coraza WAF Wasm VM with the OWASP CRS loaded, so 4 workers held the rule set 4 times. One worker serves the 200
  # req/s baseline comfortably; production overlays raise it.
  concurrency: 1
  provider:
    type: Kubernetes
    kubernetes:
      envoyService: { type: LoadBalancer, externalTrafficPolicy: Local }   # source IP preserved (§4.3)
      envoyDeployment: { replicas: 1, container: { resources: { requests: { cpu: 100m, memory: 128Mi } } } }
  telemetry:
    tracing: { provider: { type: OpenTelemetry, host: alloy.observability.svc, port: 4317 }, samplingRate: 10 }
    metrics: { prometheus: {} }
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: difme }
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef: { group: gateway.envoyproxy.io, kind: EnvoyProxy, name: difme-proxy, namespace: ingress-system }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: difme-edge, namespace: ingress-system }
spec:
  gatewayClassName: difme
  listeners:
    - { name: https, protocol: HTTPS, port: 443, hostname: "*.difme.local",
        tls: { mode: Terminate, certificateRefs: [{ name: difme-wildcard-tls }] },
        allowedRoutes: { namespaces: { from: All } } }
    # QUIC/WebTransport direct path (PDF §4.3): UDP 4443 → Quinn hub, no L7 termination at the edge.
    - { name: quic, protocol: UDP, port: 4443, allowedRoutes: { namespaces: { from: All }, kinds: [{ kind: UDPRoute }] } }
