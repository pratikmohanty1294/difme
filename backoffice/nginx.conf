server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /config.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location ~* \.(js|css|woff2|svg)$ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*"; try_files $uri =404; }
  location ~* mf-manifest\.json$ { add_header Cache-Control "no-cache"; add_header Access-Control-Allow-Origin "*"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
