# PDF §4.1 — cluster backup & restore to S3-compatible object storage every 6h.
configuration:
  backupStorageLocation: [{ name: default, provider: aws, bucket: velero, config: { region: local, s3ForcePathStyle: "true", s3Url: http://seaweedfs-s3.lakehouse.svc:8333 } }]
  volumeSnapshotLocation: []
initContainers:
  - { name: velero-plugin-for-aws, image: velero/velero-plugin-for-aws:v1.11.1, volumeMounts: [{ mountPath: /target, name: plugins }] }
schedules:
  every-6h: { schedule: "0 */6 * * *", template: { ttl: 168h, includedNamespaces: ["*"], snapshotVolumes: false, defaultVolumesToFsBackup: true } }
credentials: { existingSecret: velero-s3 }
deployNodeAgent: true
# bitnami/kubectl was withdrawn; CRD upgrade/cleanup jobs use the upstream kubectl image.
kubectl: { image: { repository: registry.k8s.io/kubectl, tag: v1.32.3 } }
# The chart's upgrade-crds Job runs `/bin/sh -c "cp `which sh` ..."` inside that image, which is distroless, so the
# Job never started and the app stayed OutOfSync (cluster-verify 2026-11-20). The chart ships its CRDs in crds/, and
# Argo CD applies those on every sync (upgrades included), so the Job isn't needed: one less pod per sync.
upgradeCRDs: false
