# PDF §10 — VictoriaMetrics (metrics), Grafana (dashboards), Alertmanager + vmalert (alerting).
# Release "victoria-metrics" + chart name produced names over Kubernetes' 63-character limit
# (victoria-metrics-victoria-metrics-k8s-stack-kube-controller-manager); this override gives the names the rest of the
# repo already uses (vmsingle-victoria-metrics-k8s-stack).
fullnameOverride: victoria-metrics-k8s-stack
# k3s runs these in-process; there is nothing separate to scrape.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }
vmsingle: { spec: { retentionPeriod: "30d", resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }, storage: { resources: { requests: { storage: 8Gi } } } } }
# vmagent joins the ambient mesh (pod label) so it can scrape meshed pods, whose mesh policy is STRICT mutual TLS;
# targets outside the mesh (node exporter, kubelet) are reached as before. Pods to scrape: dashboards/scrape.yaml.
vmagent: { spec: { podMetadata: { labels: { istio.io/dataplane-mode: ambient } }, resources: { requests: { cpu: 50m, memory: 128Mi } } } }
alertmanager:
  spec: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
  config:
    route: { receiver: default, group_by: [alertname, severity], routes: [{ matchers: ["severity=P1"], receiver: pager }] }
    receivers: [{ name: default }, { name: pager }]   # chat/paging webhooks are injected from OpenBao per environment
grafana:
  adminPassword: ""   # from secret grafana-admin
  admin: { existingSecret: grafana-admin }
  sidecar: { dashboards: { enabled: true, searchNamespace: ALL }, datasources: { enabled: true } }
  additionalDataSources:
    - { name: Loki, type: loki, url: http://loki-gateway.observability.svc }
    - { name: Tempo, type: tempo, url: http://tempo.observability.svc:3100, jsonData: { tracesToProfiles: { datasourceUid: pyroscope, profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds" }, tracesToLogsV2: { datasourceUid: loki } } }
    - { name: Pyroscope, uid: pyroscope, type: grafana-pyroscope-datasource, url: http://pyroscope.observability.svc:4040 }
  resources: { requests: { cpu: 50m, memory: 128Mi } }
kube-state-metrics: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
prometheus-node-exporter: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
# bitnami/kubectl was withdrawn; the CRD cleanup hook uses the upstream kubectl image (knowledge-base/gitops.md).
victoria-metrics-operator:
  crds: { cleanup: { image: { repository: registry.k8s.io/kubectl, tag: v1.32.3 } } }
