# PDF §11.2 — Sigstore Policy Controller (prod admission gate), complements Kyverno.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata: { name: difme-signed }
spec:
  images: [{ glob: "ghcr.io/pratikmohanty1294/difme-*" }]
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: "^https://github.com/pratikmohanty1294/difme/.*$"
      ctlog: { url: https://rekor.sigstore.dev }
