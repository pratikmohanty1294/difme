apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: starrocks
  namespace: argocd
  labels:
    difme/profile: lakehouse
    difme/pdf-section: '5.6'
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://starrocks.github.io/starrocks-kubernetes-operator
    chart: kube-starrocks
    targetRevision: 1.10.1
    helm:
      releaseName: starrocks
      valueFiles:
      - $values/deploy/platform/lakehouse/starrocks/values.yaml
  - repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    ref: values
