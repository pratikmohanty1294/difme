# ADR-008 — Fluxnova 3.1.1 Run: engine + REST API + Cockpit / Tasklist / Admin web apps.
apiVersion: apps/v1
kind: Deployment
metadata: { name: fluxnova, labels: { app: fluxnova } }
spec:
  replicas: 1
  selector: { matchLabels: { app: fluxnova } }
  template:
    metadata: { labels: { app: fluxnova, difme/team: process, business.metric: business-process } }
    spec:
      containers:
        - name: fluxnova
          image: finos/fluxnova-bpm-platform:3.1.1
          env:
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/difme/application.yml" }
            - { name: SPRING_DATASOURCE_USERNAME, value: difme }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-docdb, key: password } } }
            - { name: FLUXNOVA_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: fluxnova, key: admin-password } } }
            # Back-office workflows, not the payment path: SerialGC, capped metaspace/code cache, small stacks, 2 malloc
            # arenas (the Tier 2 control-plane profile, full JIT kept for rule/DMN evaluation).
            - { name: JAVA_OPTS, value: "-Xms128m -Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -Xss256k" }
            - { name: MALLOC_ARENA_MAX, value: "2" }
          ports: [{ containerPort: 8080 }]
          # TCP, not GET /engine-rest/version: run.auth puts Basic auth on the whole REST path, so the kubelet got 401 and
          # the pod never turned ready (cluster-verify 2026-11-20). Spring Boot opens 8080 only after the engine has started.
          readinessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 40, periodSeconds: 10 }
          volumeMounts: [{ name: config, mountPath: /difme }]
          resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1Gi } }
      volumes: [{ name: config, configMap: { name: fluxnova-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: fluxnova }
spec: { selector: { app: fluxnova }, ports: [{ port: 8080 }] }
