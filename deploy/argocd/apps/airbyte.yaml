apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbyte
  namespace: argocd
  labels:
    difme/profile: streaming-extra
    difme/pdf-section: '5.5'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://airbytehq.github.io/helm-charts
    chart: airbyte
    targetRevision: 1.5.1
    helm:
      releaseName: airbyte
      valueFiles:
      - $values/deploy/platform/streaming/airbyte/values.yaml
  - repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    ref: values
