quarkus.application.name=payment-hub
quarkus.http.port=8090
difme.temporal.target=${TEMPORAL_TARGET:temporal-frontend.temporal.svc:7233}
difme.temporal.namespace=default
# Core banking (Fineract): admin login is the generated password (fineract-db/admin-password).
difme.hub.fineract.url=${FINERACT_URL:http://fineract.rails.svc:8080/fineract-provider}
difme.hub.fineract.user=${FINERACT_USER:mifos}
difme.hub.fineract.password=${FINERACT_PASSWORD:}
difme.hub.fineract.tenant=default
# PSP (Hyperswitch): the admin key creates DIFME's merchant, its API key and the card connector at start.
difme.hub.hyperswitch.url=${HYPERSWITCH_URL:http://hyperswitch.rails.svc:8080}
difme.hub.hyperswitch.admin-key=${HYPERSWITCH_ADMIN_KEY:}
difme.hub.hyperswitch.acquirer-key=${ACQUIRER_API_KEY:}
