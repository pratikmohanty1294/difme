# Kubelet drop-in (k3s >= 1.32 reads /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/). Mounted by `make cluster`.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Network I/O: up to 3 images pull in parallel, so one 2 GB image can't block the rest or saturate the link.
# All profiles at once run about 170 pods on the one dev node; the default limit of 110 left pods Pending with
# "Too many pods" while memory was still free (cluster-verify 2026-11-20, all-at-once run 3 stopped at lakehouse).
maxPods: 240
serializeImagePulls: false
maxParallelImagePulls: 3
# Disk: unused images are deleted from 70% disk use down to 60%. They re-pull in seconds from the local registry
# caches. This keeps the 32 GB Codespace disk well below the point where YugabyteDB refuses writes (found live).
imageGCHighThresholdPercent: 70
imageGCLowThresholdPercent: 60
imageMinimumGCAge: 10m
evictionHard:
  nodefs.available: "8%"
  imagefs.available: "8%"
  memory.available: "200Mi"
# Swap (Tier 1, see ci/image-disk.sh): allow it on the node and let Burstable pods use it in proportion to their
# memory requests. Guaranteed pods and the kubelet's own reservations never swap. Requires cgroup v2 (yes) and the
# NodeSwap feature (beta, on by default since Kubernetes 1.30).
failSwapOn: false
memorySwap:
  swapBehavior: LimitedSwap
