apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: { name: difme-pool, namespace: ingress-system }
spec: { addresses: ["172.18.255.200-172.18.255.250"] }
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: { name: codespace-l2, namespace: ingress-system }
spec: { ipAddressPools: [difme-pool] }
---
# Scenario A (on-prem): BGP mode announcing the VIP to the upstream router. Enabled by overlays/onprem.
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata: { name: onprem-bgp, namespace: ingress-system, labels: { difme/scenario: onprem } }
spec: { ipAddressPools: [difme-pool], aggregationLength: 32 }
