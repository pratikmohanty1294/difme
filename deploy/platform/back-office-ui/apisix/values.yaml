# PDF §5.9 / §5.10 — back-office API gateway: OIDC (Keycloak, ADR-010), rate limits, REST routing, tracing.
apisix: { deployment: { mode: standalone, role: data_plane, role_data_plane: { config_provider: yaml } } }
etcd: { enabled: false }
ingress-controller: { enabled: false }
resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
extraEnvVars:
  - { name: OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: apisix-oidc, key: client-secret } } }
apisixStandalone:
  plugin_configs:
    - id: oidc
      plugins:
        openid-connect:
          discovery: "http://keycloak.security.svc:8080/realms/difme/.well-known/openid-configuration"
          client_id: apisix
          client_secret: "$ENV://OIDC_CLIENT_SECRET"
          bearer_only: true
          use_jwks: true
          set_userinfo_header: true
        limit-req: { rate: 50, burst: 50, key: remote_addr }
        opentelemetry: { sampler: { name: always_on } }
  routes:
    - id: process
      uri: /api/process/*
      plugin_config_id: oidc
      plugins: { proxy-rewrite: { regex_uri: ["^/api/process/(.*)", "/$1"] } }
      upstream: { type: roundrobin, nodes: { "process-gateway.process.svc:8088": 1 } }
    - id: settlements
      uri: /api/settlements/*
      plugin_config_id: oidc
      plugins: { proxy-rewrite: { regex_uri: ["^/api/(.*)", "/v1/$1"] } }
      upstream: { type: roundrobin, nodes: { "quarkus-qry-svc.core-platform.svc:8081": 1 }, timeout: { read: 3600 } }
    - id: audit
      uris: [/api/audit, /api/audit/*]
      plugin_config_id: oidc
      plugins: { proxy-rewrite: { regex_uri: ["^/api/(.*)", "/v1/$1"] } }
      upstream: { type: roundrobin, nodes: { "quarkus-qry-svc.core-platform.svc:8081": 1 } }
    - id: analytics
      uri: /api/analytics/*
      plugin_config_id: oidc
      plugins: { proxy-rewrite: { regex_uri: ["^/api/(.*)", "/v1/$1"] } }
      upstream: { type: roundrobin, nodes: { "quarkus-qry-svc.core-platform.svc:8081": 1 } }
    - id: flags
      uri: /api/flags/*
      plugins: { proxy-rewrite: { regex_uri: ["^/api/flags/(.*)", "/$1"] } }   # OFREP; flag evaluation is not sensitive
      upstream: { type: roundrobin, nodes: { "flagd.core-platform.svc:8016": 1 } }
