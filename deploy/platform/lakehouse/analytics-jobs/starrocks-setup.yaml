apiVersion: batch/v1
kind: Job
metadata: { name: starrocks-setup, annotations: { argocd.argoproj.io/hook: PostSync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation } }
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql
          image: mariadb:11.8
          env:
            - { name: POLARIS_CREDENTIAL, valueFrom: { secretKeyRef: { name: polaris-client, key: credential } } }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: flink-s3, key: access-key } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: flink-s3, key: secret-key } } }
          command: [sh, -c]
          args: ["envsubst < /sql/catalog.sql > /tmp/c.sql 2>/dev/null || sed -e \"s#\\${POLARIS_CREDENTIAL}#$POLARIS_CREDENTIAL#; s#\\${S3_ACCESS_KEY}#$S3_ACCESS_KEY#; s#\\${S3_SECRET_KEY}#$S3_SECRET_KEY#\" /sql/catalog.sql > /tmp/c.sql; mariadb -h kube-starrocks-fe-service -P 9030 -u root < /tmp/c.sql"]
          volumeMounts: [{ name: sql, mountPath: /sql }]
      volumes: [{ name: sql, configMap: { name: starrocks-sql } }]
