syntax = "proto3";

// PDF §11.1 — RATS RFC 9334 Verifier API used by the Quinn hub.
package difme.attestation.v1;

option java_multiple_files = true;
option java_package = "dev.difme.grpc.attestation.v1";

service AttestationVerifier {
  rpc Challenge(ChallengeRequest) returns (ChallengeResponse);
  rpc Verify(Evidence) returns (AttestationResult);
}

message ChallengeRequest { string device_id = 1; }
message ChallengeResponse { bytes nonce = 1; int64 expires_at_ms = 2; }

message Evidence {
  string device_id = 1;
  bytes eat_token = 2;          // CBOR-encoded EAT (RFC 8392 CWT)
  bytes nonce = 3;
  double fraud_score = 4;
  string wasm_module_sha256 = 5;
}

message AttestationResult {
  bool trusted = 1;
  repeated string failed_checks = 2;  // binary_hash | freshness | revoked_platform | signature
  bool fallback_server_check = 3;     // FAIL path → full server-side fraud check
}
