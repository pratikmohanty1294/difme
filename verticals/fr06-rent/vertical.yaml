# FR-06 Rent It For Me: planned. Parameters from the PRD (§3.1, §5.1, §5.4.1); the kernel already runs
# this pipeline, so going live needs eligibility rules, the rail adapters and a fulfilment verifier.
id: fr06-rent
name: Rent It For Me
goal: A requester rents data, compute or equipment for a time window under a contract.
status: planned
domain: data
weights: { price: 0.40, reputation: 0.40, latency: 0.20 }
collateral: { alpha: 0.1, gamma_rev: 1.0, min_minor: 50000 }   # D_min: owner to confirm
auction: { mode: rfq, window_ms: 1000, latency_max_ms: 5000, backups: 2 }
price_basis:
  ask: rental price
  max_acceptable: requester's maximum price
settlement:
  trigger: cryptographic telemetry handshake or HTTP 402 payment acknowledgement
  split_release: pro-rata for unused windows
evidence:
  chains: [S, B, I]
  fulfillment: telemetry handshake / 402 receipt
rails: [data-contract, http-402, iot-lease]
dpi: [Beckn DDM, EU data spaces (ODRL), HTTP 402]
