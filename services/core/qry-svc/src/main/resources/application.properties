quarkus.application.name=quarkus-qry-svc
quarkus.http.port=8081

# EVENTUAL reads from YugabyteDB follower replicas (PDF §5.4 / §14): read-only sessions, follower reads on.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://yb-tservers.database-tier.svc:5433/difme}
quarkus.datasource.username=${DB_USER:difme_reader}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.new-connection-sql=SET yb_read_from_followers = true; SET default_transaction_read_only = true; SET yb_follower_read_staleness_ms = 30000
quarkus.datasource.jdbc.max-size=30
quarkus.mybatis.map-underscore-to-camel-case=true

quarkus.redis.hosts=${VALKEY_URL:redis://valkey.cache-tier.svc:6379}
difme.cache.l1.max-size=100000
difme.cache.l1.ttl=PT5M
difme.cache.l2.ttl=PT1H

difme.tigerbeetle.cluster-id=0
difme.tigerbeetle.addresses=${TB_ADDRESSES:tigerbeetle.database-tier.svc:3000}

quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc:4317}
quarkus.micrometer.export.prometheus.path=/q/metrics
