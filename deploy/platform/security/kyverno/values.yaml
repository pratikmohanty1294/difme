admissionController:
  replicas: 1
  # Generate rule (policies/kyverno/generate-default-deny.yaml) creates CiliumNetworkPolicies (found live 2026-11-17).
  rbac: { clusterRole: { extraResources: [{ apiGroups: [cilium.io], resources: [ciliumnetworkpolicies], verbs: [get, list, watch] }] } }
backgroundController:
  enabled: true
  rbac: { clusterRole: { extraResources: [{ apiGroups: [cilium.io], resources: [ciliumnetworkpolicies], verbs: [get, list, watch, create, update, patch, delete] }] } }
cleanupController: { enabled: true }
# 128Mi default was OOM-killed generating reports for a whole profile (found live); refine from measurements.
reportsController: { enabled: true, resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 320Mi } } }
# Hook jobs: official Kubernetes kubectl image (the chart default was withdrawn from Docker Hub; found live).
webhooksCleanup: { image: { registry: registry.k8s.io, repository: kubectl, tag: v1.32.3 } }
# Disabled: a migration helper for upgrades from old Kyverno releases that runs /bin/bash, which the official
# (distroless) kubectl image does not have. Fresh installs have no legacy reports to clean (found live).
policyReportsCleanup: { enabled: false }
