# PDF §5.8 — SPIFFE workload identity, X.509 SVIDs, 24h rotation, OpenBao as upstream CA.
global:
  # The chart's pre-/post-upgrade hooks patch the controller-manager webhook around `helm upgrade`. Argo CD runs
  # pre-upgrade hooks as PreSync even on first install, where the webhook doesn't exist yet, so the hook failed and
  # spire never synced (cluster-verify 2026-11-20).
  installAndUpgradeHooks: { enabled: false }
  spire:
    trustDomain: difme.local
    clusterName: difme
spire-server:
  ca_ttl: 168h
  default_x509_svid_ttl: 24h
  upstreamAuthority:
    vault:
      enabled: true
      vaultAddr: http://openbao.security.svc:8200
      pkiMountPoint: pki_int
      insecureSkipVerify: true   # in-cluster OpenBao listens on plain HTTP (mesh mTLS); else the chart mounts a missing vault-ca Secret
      k8sAuth: { enabled: true, k8sAuthRoleName: spire-server }
  federation: { enabled: true }        # scenario C: on-prem ↔ cloud federated trust domains
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        default:
          spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
spire-agent: { resources: { requests: { cpu: 20m, memory: 64Mi } } }
spiffe-csi-driver: { enabled: true }
spiffe-oidc-discovery-provider: { enabled: true }
