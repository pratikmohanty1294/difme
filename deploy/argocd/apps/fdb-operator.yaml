apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fdb-operator
  namespace: argocd
  labels:
    difme/profile: core
    difme/pdf-section: '8'
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: database-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://foundationdb.github.io/fdb-kubernetes-operator
    chart: fdb-operator
    targetRevision: 2.3.0
    helm:
      releaseName: fdb-operator
      valueFiles:
      - $values/deploy/platform/database-tier/fdb-operator/values.yaml
  - repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    ref: values
