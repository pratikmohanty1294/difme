# Iceberg REST catalog (ADR-005): shared by Trino, Spark and Flink; metadata on YugabyteDB.
apiVersion: apps/v1
kind: Deployment
metadata: { name: polaris, labels: { app: polaris } }
spec:
  replicas: 1
  selector: { matchLabels: { app: polaris } }
  template:
    metadata: { labels: { app: polaris } }
    spec:
      containers:
        - name: polaris
          image: apache/polaris:1.0.0-incubating
          env:
            - { name: POLARIS_PERSISTENCE_TYPE, value: relational-jdbc }
            - { name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://yb-tservers.database-tier.svc:5433/polaris" }
            - { name: POLARIS_BOOTSTRAP_CREDENTIALS, valueFrom: { secretKeyRef: { name: polaris-bootstrap, key: credentials } } }
          ports: [{ name: api, containerPort: 8181 }, { name: mgmt, containerPort: 8182 }]
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: polaris }
spec: { selector: { app: polaris }, ports: [{ name: api, port: 8181 }, { name: mgmt, port: 8182 }] }
