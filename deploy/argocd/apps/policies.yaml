apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
  labels:
    difme/profile: base
    difme/pdf-section: '11.3'
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: kyverno.io
    kind: ClusterPolicy
    managedFieldsManagers:
    - kyverno
    jqPathExpressions:
    - .spec.rules[]?.skipBackgroundRequests
    - .spec.admission
    - .spec.emitWarning
  - group: constraints.gatekeeper.sh
    kind: '*'
    managedFieldsManagers:
    - gatekeeper
  source:
    repoURL: https://github.com/pratikmohanty1294/difme.git
    targetRevision: main
    path: deploy/platform/security/policies
