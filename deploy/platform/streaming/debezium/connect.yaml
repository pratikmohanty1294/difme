# PDF §5.5 — Debezium CDC (LSN-based, at-least-once) with the CloudEvents converter carrying trace context.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata: { name: debezium, annotations: { strimzi.io/use-connector-resources: "true" } }
spec:
  version: 4.2.0
  replicas: 1
  bootstrapServers: difme-kafka-bootstrap:9092
  config:
    group.id: debezium
    offset.storage.topic: _connect-offsets
    config.storage.topic: _connect-configs
    status.storage.topic: _connect-status
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    # Lets connectors set producer.override.* (idempotent, acks=all for the outbox relay — ADR-017).
    connector.client.config.override.policy: All
  # Prebuilt in CI (deploy/images/debezium-connect): Debezium Postgres connector + Apicurio converters.
  image: ghcr.io/pratikmohanty1294/difme-debezium-connect:3.7.1
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
