# Serves one DiscountAI role app and proxies the exchange API on the same origin (no CORS, no API host in the bundle).
server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # /api/v1/exchange/... → exchange-svc /v1/exchange/...
  location /api/ {
    proxy_pass http://exchange-svc.core-platform.svc:8089/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
  }
  # Service worker and manifest must be revalidated, or clients keep an old app version.
  location ~* (sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location ~* \.(js|css|png)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
