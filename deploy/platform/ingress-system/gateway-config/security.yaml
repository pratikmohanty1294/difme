# TLS 1.3 only + edge rate limit (PDF §4.3).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: { name: tls13-only, namespace: ingress-system }
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: difme-edge }]
  tls: { minVersion: "1.3", alpnProtocols: [h2, http/1.1] }
  http3: {}
  clientIPDetection: { xForwardedFor: { numTrustedHops: 1 } }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: { name: edge-rate-limit, namespace: ingress-system }
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: difme-edge }]
  rateLimit:
    type: Local
    local: { rules: [{ clientSelectors: [{ sourceCIDR: { type: Distinct, value: 0.0.0.0/0 } }], limit: { requests: 200, unit: Second } }] }
