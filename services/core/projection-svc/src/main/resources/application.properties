quarkus.application.name=projection-svc
quarkus.http.port=8086
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://yb-tservers.database-tier.svc:5433/difme}
quarkus.datasource.username=${DB_USER:difme}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.redis.hosts=${VALKEY_URL:redis://valkey.cache-tier.svc:6379}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:difme-kafka-bootstrap.streaming.svc:9092}
mp.messaging.incoming.payments.connector=smallrye-kafka
mp.messaging.incoming.payments.topic=payments.events.v1
mp.messaging.incoming.payments.group.id=projection-svc
mp.messaging.incoming.payments.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payments.auto.offset.reset=earliest
# ── Error handling (ADR-017) ─────────────────────────────────────────────────────────────────────────────────
# Transient failures: retry via delay topics (1 s, 10 s, 60 s), then the DLQ. Poison messages (undecodable) skip the
# ladder and go straight to the DLQ from the consumer. Topics are declared in deploy/platform/streaming/kafka.
mp.messaging.incoming.payments.failure-strategy=delayed-retry-topic
mp.messaging.incoming.payments.delayed-retry-topic.topics=projection-svc.payments.retry_1000,projection-svc.payments.retry_10000,projection-svc.payments.retry_60000
mp.messaging.incoming.payments.delayed-retry-topic.max-retries=3
mp.messaging.incoming.payments.delayed-retry-topic.timeout=300000
mp.messaging.incoming.payments.dead-letter-queue.topic=projection-svc.payments.dlq
# Backpressure: bounded batches; the connector pauses the partition while the app is busy (no unbounded buffering).
mp.messaging.incoming.payments.max.poll.records=500
mp.messaging.incoming.payments.pause-if-no-requests=true
mp.messaging.incoming.payments.enable.auto.commit=false
mp.messaging.outgoing.payments-dlq.connector=smallrye-kafka
mp.messaging.outgoing.payments-dlq.topic=projection-svc.payments.dlq
mp.messaging.outgoing.payments-dlq.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payments-dlq.acks=all
mp.messaging.outgoing.payments-dlq.enable.idempotence=true
quarkus.shutdown.timeout=PT20S
