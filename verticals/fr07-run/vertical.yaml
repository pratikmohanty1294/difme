# FR-07 Run It For Me: planned. Parameters from the PRD (§3.1, §5.1, §5.4.1); the kernel already runs
# this pipeline, so going live needs eligibility rules, the rail adapters and a fulfilment verifier.
id: fr07-run
name: Run It For Me
goal: A requester runs a container, training or simulation job on attested hardware.
status: planned
domain: compute
weights: { price: 0.30, reputation: 0.30, latency: 0.40 }
collateral: { alpha: 0.1, gamma_rev: 1.0, min_minor: 50000 }   # D_min: owner to confirm
auction: { mode: sbba, window_ms: 50, latency_max_ms: 60000, backups: 2 }
price_basis:
  ask: compute price
  max_acceptable: requester's maximum price
settlement:
  trigger: result SHA-256 matches the TEE enclave quote
  split_release: re-execution on failure
evidence:
  chains: [S, B, I]
  fulfillment: TEE quote + result hash
rails: [compute-grid, tee-attestation, http-402]
dpi: [Kubernetes, Confidential computing (SEV / TDX)]
