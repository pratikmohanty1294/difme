# PDF §5.8 — just-in-time, identity-based infra access with session recording (Warpgate, ADR-001).
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: warpgate, namespace: security, labels: { app: warpgate } }
spec:
  serviceName: warpgate
  replicas: 1
  selector: { matchLabels: { app: warpgate } }
  template:
    metadata: { labels: { app: warpgate } }
    spec:
      # First start: write /data/warpgate.yaml (the chart's own setup job does the same). v0.13.2 never existed as a tag;
      # 0.26.0 is the current release and ships amd64 + arm64.
      initContainers:
        - name: setup
          image: ghcr.io/warp-tech/warpgate:0.26.0
          env: [{ name: WARPGATE_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: warpgate, key: admin-password } } }]
          command: [/bin/sh, -c]
          args:
            - |
              set -e
              [ -f /data/warpgate.yaml ] && exit 0
              warpgate -c /data/warpgate.yaml unattended-setup --data-path /data --http-port 8888 --ssh-port 2222 --postgres-port 55432 --record-sessions
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
      containers:
        - name: warpgate
          image: ghcr.io/warp-tech/warpgate:0.26.0
          args: [--config, /data/warpgate.yaml, run]
          ports: [{ name: https, containerPort: 8888 }, { name: ssh, containerPort: 2222 }, { name: postgres, containerPort: 55432 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: warpgate, namespace: security }
spec:
  selector: { app: warpgate }
  ports: [{ name: https, port: 8888 }, { name: ssh, port: 2222 }, { name: postgres, port: 55432 }]
