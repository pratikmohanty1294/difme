# Lets Kyverno generate the per-namespace default-deny CiliumNetworkPolicy (generate-default-deny.yaml).
# Aggregated into Kyverno's own roles via its aggregation labels (found on the live cluster, 2026-11-17).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-generate-cilium-policies
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
