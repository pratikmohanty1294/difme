# PDF §8 — append-only audit log store (Apache Cassandra 5, ADR-001). Quorum writes, SAI indexes.
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata: { name: difme-audit, namespace: database-tier }
spec:
  cassandra:
    serverVersion: "5.0.3"
    datacenters:
      - metadata: { name: dc1 }
        size: 1
        storageConfig:
          cassandraDataVolumeClaimSpec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
        config:
          jvmOptions: { heapSize: 768M }
          cassandraYaml: { sai_options: { segment_write_buffer_size: 64MiB } }
        resources: { requests: { cpu: 200m, memory: 1536Mi }, limits: { memory: 2Gi } }
