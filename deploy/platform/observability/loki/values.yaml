deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  schemaConfig: { configs: [{ from: "2025-01-01", store: tsdb, object_store: s3, schema: v13, index: { prefix: index_, period: 24h } }] }
  storage: { type: s3, bucketNames: { chunks: loki, ruler: loki, admin: loki }, s3: { endpoint: http://seaweedfs-s3.lakehouse.svc:8333, s3ForcePathStyle: true, insecure: true } }
singleBinary: { replicas: 1, resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } } }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
