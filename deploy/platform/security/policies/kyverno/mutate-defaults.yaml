apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: mutate-security-defaults }
spec:
  rules:
    - name: run-as-non-root
      match: { any: [{ resources: { kinds: [Pod], namespaces: [core-platform, quinn-hub, back-office-ui] } }] }
      mutate:
        patchStrategicMerge:
          spec:
            securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
            containers:
              - (name): "*"
                securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
    # Third-party operators and charts (Strimzi, KEDA, Apicurio, Flink, RisingWave, ...) don't carry our
    # cost-attribution labels, so require-labels-and-limits rejected them and the streaming profile never came up.
    # Fill in shared-infrastructure defaults only where a label is missing; our own services keep theirs.
    - name: default-cost-attribution-labels
      match: { any: [{ resources: { kinds: [Deployment, StatefulSet, Job], namespaces: [streaming, ml-platform] } }] }
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                labels:
                  +(difme/team): platform
                  +(business.metric): shared-infra
