# PDF §8 L2 cache + CRDT rate limiting on Valkey (ADR-001). valkey-0 primary, valkey-1/2 replicas.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: valkey, namespace: cache-tier, labels: { app: valkey } }
spec:
  serviceName: valkey-headless
  replicas: 3
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1.1
          command: [sh, -c]
          args:
            - |
              if [ "${HOSTNAME##*-}" = "0" ]; then exec valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lfu;
              else exec valkey-server --appendonly yes --replicaof valkey-0.valkey-headless 6379; fi
          ports: [{ containerPort: 6379 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 320Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: valkey-headless, namespace: cache-tier }
spec: { clusterIP: None, selector: { app: valkey }, ports: [{ port: 6379 }] }
---
apiVersion: v1
kind: Service
metadata: { name: valkey, namespace: cache-tier }
spec: { selector: { app: valkey, statefulset.kubernetes.io/pod-name: valkey-0 }, ports: [{ port: 6379 }] }
