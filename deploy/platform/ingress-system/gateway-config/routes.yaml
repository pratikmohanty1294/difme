# ADR-015: Envoy Gateway is the only L7 proxy. It replaces Kong (external API) and APISIX (back-office API):
# routing, path rewrites, JWT verification (Keycloak), rate limits and timeouts are Gateway API / Envoy Gateway policy.

# ── External API: api.difme.local ─────────────────────────────────────────────────────────────────────────────
# Rate limits differ per API, so each API is its own route with its own policy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: public-payments, namespace: ingress-system }
spec:
  parentRefs: [{ name: difme-edge, sectionName: https }]
  hostnames: [api.difme.local]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /v1/payments } }, { path: { type: PathPrefix, value: /v1/transfers } }]
      backendRefs: [{ name: quarkus-cmd-svc, namespace: core-platform, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: public-accounts, namespace: ingress-system }
spec:
  parentRefs: [{ name: difme-edge, sectionName: https }]
  hostnames: [api.difme.local]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /v1/accounts } }]
      backendRefs: [{ name: quarkus-qry-svc, namespace: core-platform, port: 8081 }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: { name: public-api-jwt, namespace: ingress-system }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: public-payments }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: public-accounts }
  jwt:
    providers:
      - name: keycloak
        issuer: https://id.difme.local/realms/difme
        remoteJWKS: { uri: http://keycloak.security.svc:8080/realms/difme/protocol/openid-connect/certs }
---
# Payments: no gateway retries (idempotency is by key; retries stay explicit at the client).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: { name: public-payments-limits, namespace: ingress-system }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: public-payments }
  rateLimit:
    type: Local
    local: { rules: [{ limit: { requests: 100, unit: Second } }] }
  timeout: { http: { requestTimeout: 10s } }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: { name: public-accounts-limits, namespace: ingress-system }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: public-accounts }
  rateLimit:
    type: Local
    local: { rules: [{ limit: { requests: 500, unit: Second } }] }
  timeout: { http: { requestTimeout: 10s } }
---
# ── Back-office API: ops.difme.local/api (JWT) ───────────────────────────────────────────────────────────────
# One match per rule: a prefix rewrite needs exactly one PathPrefix match (Gateway API validation).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: back-office-api, namespace: ingress-system }
spec:
  parentRefs: [{ name: difme-edge, sectionName: https }]
  hostnames: [ops.difme.local]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/process } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } }]
      backendRefs: [{ name: process-gateway, namespace: process, port: 8088 }]
    - matches: [{ path: { type: PathPrefix, value: /api/settlements } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: /v1/settlements } } }]
      backendRefs: [{ name: quarkus-qry-svc, namespace: core-platform, port: 8081 }]
    - matches: [{ path: { type: PathPrefix, value: /api/audit } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: /v1/audit } } }]
      backendRefs: [{ name: quarkus-qry-svc, namespace: core-platform, port: 8081 }]
    - matches: [{ path: { type: PathPrefix, value: /api/analytics } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: /v1/analytics } } }]
      backendRefs: [{ name: quarkus-qry-svc, namespace: core-platform, port: 8081 }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: { name: back-office-jwt, namespace: ingress-system }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: back-office-api }
  jwt:
    providers:
      - name: keycloak
        issuer: https://id.difme.local/realms/difme
        remoteJWKS: { uri: http://keycloak.security.svc:8080/realms/difme/protocol/openid-connect/certs }
---
# Long timeout: the settlements live stream uses server-sent events.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata: { name: back-office-limits, namespace: ingress-system }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: back-office-api }
  rateLimit:
    type: Local
    local: { rules: [{ limit: { requests: 50, unit: Second } }] }
  timeout: { http: { requestTimeout: 3600s } }
---
# Feature-flag evaluation (OFREP) for the browser: not sensitive, no auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: back-office-flags, namespace: ingress-system }
spec:
  parentRefs: [{ name: difme-edge, sectionName: https }]
  hostnames: [ops.difme.local]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/flags } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } }]
      backendRefs: [{ name: flagd, namespace: core-platform, port: 8016 }]
---
# ── Back-office UI: shell + independently deployed remotes ──────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: back-office, namespace: ingress-system }
spec:
  parentRefs: [{ name: difme-edge, sectionName: https }]
  hostnames: [ops.difme.local]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /remotes/settlements } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } }]
      backendRefs: [{ name: remote-settlements, namespace: back-office-ui, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: /remotes/compliance } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } }]
      backendRefs: [{ name: remote-compliance, namespace: back-office-ui, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: /remotes/analytics } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } }]
      backendRefs: [{ name: remote-analytics, namespace: back-office-ui, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: /remotes/process-studio } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } }]
      backendRefs: [{ name: remote-process-studio, namespace: back-office-ui, port: 80 }]
    - matches: [{ path: { type: PathPrefix, value: /remotes/form-builder } }]
      filters: [{ type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } }]
      backendRefs: [{ name: remote-form-builder, namespace: back-office-ui, port: 80 }]
    - backendRefs: [{ name: backoffice-shell, namespace: back-office-ui, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: identity, namespace: ingress-system }
spec:
  parentRefs: [{ name: difme-edge, sectionName: https }]
  hostnames: [id.difme.local]
  rules: [{ backendRefs: [{ name: keycloak, namespace: security, port: 8080 }] }]
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata: { name: quic-hub, namespace: quinn-hub }
spec:
  parentRefs: [{ name: difme-edge, namespace: ingress-system, sectionName: quic }]
  rules: [{ backendRefs: [{ name: quinn-hub, port: 4443 }] }]
---
# Cross-namespace backends referenced from ingress-system routes.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: allow-ingress-system, namespace: back-office-ui }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ingress-system }]
  to: [{ group: "", kind: Service }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: allow-ingress-system, namespace: core-platform }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ingress-system }]
  to: [{ group: "", kind: Service }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: allow-ingress-system, namespace: process }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ingress-system }]
  to: [{ group: "", kind: Service, name: process-gateway }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: allow-ingress-system, namespace: security }
spec:
  from: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ingress-system }]
  to: [{ group: "", kind: Service, name: keycloak }]
