# Builds and tests the Quarkus core (Java 25) and enforces the Semgrep purity gate (PDF §4.5, §9).
name: core-services
on:
  push: { branches: [main, "wip-*"], paths: ["services/core/**", "api/proto/**", "api/openapi/**", "policies/semgrep/**", ".github/workflows/core-services.yml"] }
  pull_request: { paths: ["services/core/**", "api/proto/**", "api/openapi/**", "policies/semgrep/**"] }
permissions: { contents: read }
jobs:
  semgrep:
    name: Semgrep SAST + purity gate
    runs-on: ubuntu-24.04
    container: { image: "semgrep/semgrep:1.108.0" }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config policies/semgrep --error --metrics=off services/
  build:
    name: Build + unit tests (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      # Maven Central rate-limits and occasionally fails shared CI IPs (429 / "artifact absent" seen 2026-11-20);
      # resolve through Google's public Maven Central mirror, as the image builds do.
      - name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings><mirrors><mirror><id>central-gcs</id><mirrorOf>central</mirrorOf>
          <url>https://maven-central.storage-download.googleapis.com/maven2/</url></mirror></mirrors></settings>
          XML
      # Same gate as ci/check.sh core: "key=value   # note" keeps the note in the value and the service fails at
      # startup, which unit tests never reach (cmd-svc crash-looped on difme.flagd.port, 2026-11-19).
      - name: No inline comments in application.properties values
        run: |
          if grep -nE '^[^#!][^=]*=.*[^\\]\s+#' services/*/*/src/main/resources/application.properties; then
            echo "::error::inline comment in an application.properties value (put the comment on its own line)"; exit 1
          fi
      - run: mvn -B -ntp -f services/core/pom.xml verify
      # ADR-014 contract tests: Schemathesis generates requests from the OpenAPI contract and runs them against the
      # real exchange-svc (in-memory, no cluster needed). Any 5xx fails the build; it found null-body 500s on day one.
      - name: Contract tests (Schemathesis) against a live exchange-svc
        run: |
          java --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED -jar services/core/exchange-svc/target/quarkus-app/quarkus-run.jar > /tmp/exchange-svc.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8089/q/health/ready >/dev/null && break; sleep 1; done
          pip install -q --break-system-packages schemathesis==4.32.7
          st --config-file api/openapi/schemathesis.toml run api/openapi/difme.openapi.yaml --url http://localhost:8089 \
            --include-path-regex '^/v1/exchange' --checks not_a_server_error --max-examples 30
      - name: exchange-svc log on failure
        if: failure()
        run: grep -E 'ERROR|Caused by' /tmp/exchange-svc.log | tail -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: surefire-reports, path: "services/core/*/target/surefire-reports/", if-no-files-found: ignore }
