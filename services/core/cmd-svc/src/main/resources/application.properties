quarkus.application.name=quarkus-cmd-svc
quarkus.http.port=8080
quarkus.grpc.server.use-separate-server=false
quarkus.virtual-threads.name-prefix=cmd-vt

# Write path — Hibernate ORM + Panache on YugabyteDB YSQL (PDF §5.4). Credentials come from OpenBao (TTL 1h).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://yb-tservers.database-tier.svc:5433/difme}
quarkus.datasource.username=${DB_USER:difme}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.transaction-isolation-level=serializable
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=core,read,inbox,settlement

# L2 cache (Valkey) — write-through after commit (PDF §5.4)
quarkus.redis.hosts=${VALKEY_URL:redis://valkey.cache-tier.svc:6379}

difme.tigerbeetle.cluster-id=0
difme.tigerbeetle.addresses=${TB_ADDRESSES:tigerbeetle.database-tier.svc:3000}
difme.tigerbeetle.ledger=1
difme.fdb.cluster-file=${FDB_CLUSTER_FILE:/var/dynamic-conf/fdb.cluster}
difme.idempotency.ttl=PT24H
difme.temporal.target=${TEMPORAL_TARGET:temporal-frontend.temporal.svc:7233}
difme.temporal.namespace=default
difme.flagd.host=${FLAGD_HOST:flagd.core-platform.svc}
difme.flagd.port=8013
quarkus.rest-client.process-gateway.url=${PROCESS_GATEWAY_URL:http://process-gateway.process.svc:8088}
quarkus.rest-client.rate-limiter.url=${RATE_LIMITER_URL:http://rate-limiter.core-platform.svc:8084}
difme.region=${DIFME_REGION:region-a}

quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc:4317}
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.json=false
