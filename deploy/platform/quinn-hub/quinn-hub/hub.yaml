# PDF §5.2 — Rust QUIC gateway (quinn + tokio): quinn-hub, session-manager, grpc-bridge, telemetry-relay, live-dashboard-relay.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: quinn-hub, labels: { app: quinn-hub } }
spec:
  serviceName: quinn-hub
  replicas: 1
  selector: { matchLabels: { app: quinn-hub } }
  template:
    metadata:
      labels: { app: quinn-hub, difme/team: edge, business.metric: payment-processing }
      annotations: { profiles.grafana.com/cpu.scrape: "true", profiles.grafana.com/cpu.port: "9100" }
    spec:
      serviceAccountName: quinn-hub
      containers:
        - name: hub
          image: ghcr.io/pratikmohanty1294/difme-quinn-hub:0.1.0
          ports: [{ name: quic, containerPort: 4443, protocol: UDP }, { name: sse, containerPort: 8443 }, { name: metrics, containerPort: 9100 }]
          env:
            - { name: HUB_GRPC_CORE, value: "http://quarkus-cmd-svc.core-platform.svc:9000" }
            - { name: HUB_KAFKA_BROKERS, value: "difme-kafka-bootstrap.streaming.svc:9092" }
            - { name: HUB_VALKEY_URL, value: "redis://valkey.cache-tier.svc:6379/1" }
            - { name: HUB_ATTESTATION_URL, value: "https://attestation-verifier.security.svc:8443" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///spiffe-workload-api/spire-agent.sock" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://alloy.observability.svc:4317" }
            - { name: PYROSCOPE_URL, value: "http://pyroscope.observability.svc:4040" }
          volumeMounts: [{ name: spiffe, mountPath: /spiffe-workload-api, readOnly: true }]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 256Mi } }
      volumes: [{ name: spiffe, csi: { driver: csi.spiffe.io, readOnly: true } }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: quinn-hub }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: grpc-bridge }
---
apiVersion: v1
kind: Service
metadata: { name: quinn-hub }
spec:
  selector: { app: quinn-hub }
  ports: [{ name: quic, port: 4443, protocol: UDP }, { name: sse, port: 8443 }, { name: metrics, port: 9100 }]
