# PDF §8 — KYC / user accounts (eventual follower reads) AND settlements (serializable; ADR-001 replaces the
# proprietary settlement DB). Also the Temporal persistence backend and the Apicurio/Polaris metadata store.
replicas: { master: 1, tserver: 1 }
resource:
  master: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
  tserver: { requests: { cpu: 300m, memory: 1Gi }, limits: { memory: 2Gi } }
storage: { master: { size: 4Gi }, tserver: { size: 8Gi } }
enableLoadBalancer: false
gflags:
  tserver:
    yb_enable_read_committed_isolation: true
    ysql_enable_packed_row: true
    enable_automatic_tablet_splitting: true
    ysql_pg_conf_csv: "default_transaction_isolation='serializable'"
    # Flyway serialises migrations with pg_advisory_lock; YugabyteDB 2.25 ships advisory locks as a preview feature
    # (found live: "advisory locks feature is currently in preview"). The community Flyway YugabyteDB module, which
    # uses a lock table instead, stops at Flyway 10 and Quarkus uses Flyway 12.
    ysql_yb_enable_advisory_locks: true
    allowed_preview_flags_csv: ysql_yb_enable_advisory_locks
    # Network pass (A/B): tserver↔master traffic was ~500 KB/s each way at idle (cluster-verify 44733260505). Heartbeats
    # every 3 s instead of 1 s; the master marks a tserver dead only after 60 s (tserver_unresponsive_timeout_ms).
    heartbeat_interval_ms: 3000
  master:
    enable_automatic_tablet_splitting: true
    ysql_yb_enable_advisory_locks: true
    allowed_preview_flags_csv: ysql_yb_enable_advisory_locks
tls: { enabled: false }   # Codespace: in-cluster encryption via the mesh; production overlay enables YB TLS + auth
