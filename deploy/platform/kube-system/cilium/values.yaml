# PDF §4.6 — eBPF kube-proxy replacement, WireGuard pod-to-pod encryption, Hubble L7 flow logs.
kubeProxyReplacement: true
k8sServiceHost: ""          # set by bootstrap/install.sh
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
loadBalancer: { algorithm: maglev }
bpf: { masquerade: true }
encryption: { enabled: true, type: wireguard }
hubble:
  enabled: true
  relay: { enabled: true }
  ui: { enabled: true }
  metrics:
    enabled: [dns, drop, tcp, flow, "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,destination_namespace"]
    serviceMonitor: { enabled: false }
operator: { replicas: 1 }
resources: { requests: { cpu: 100m, memory: 256Mi } }
