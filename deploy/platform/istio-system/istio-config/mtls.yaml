# PDF §4.4 — PeerAuthentication STRICT on all namespaces.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: default, namespace: istio-system }
spec: { mtls: { mode: STRICT } }
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: core-command-callers, namespace: core-platform }
spec:
  targetRefs: [{ kind: Service, group: "", name: quarkus-cmd-svc }]
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["difme.local/ns/quinn-hub/sa/grpc-bridge", "difme.local/ns/core-platform/sa/saga-orchestrator", "difme.local/ns/core-platform/sa/rehydration-svc"] } }]
