apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: difme-selfsigned }
spec: { selfSigned: {} }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: difme-ca, namespace: ingress-system }
spec: { isCA: true, commonName: difme-ca, secretName: difme-ca, privateKey: { algorithm: ECDSA, size: 256 }, issuerRef: { name: difme-selfsigned, kind: ClusterIssuer } }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: { name: difme-ca, namespace: ingress-system }
spec: { ca: { secretName: difme-ca } }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: difme-wildcard, namespace: ingress-system }
spec: { secretName: difme-wildcard-tls, dnsNames: ["*.difme.local"], privateKey: { algorithm: ECDSA, size: 256 }, issuerRef: { name: difme-ca, kind: Issuer } }
