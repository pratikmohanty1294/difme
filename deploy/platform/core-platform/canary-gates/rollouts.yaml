# PDF §4.5 canary gate — Argo Rollouts analysis against VictoriaMetrics SLOs at 10% before full rollout,
# auto-rollback if health fails within 5 minutes.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata: { name: slo-gate }
spec:
  args: [{ name: service }]
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.995
      failureLimit: 1
      provider:
        prometheus:
          address: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8429
          # "or vector(1)": with no traffic the ratio is empty and the analysis errored, aborting the very first rollout
          # of a fresh cluster (found by cluster-verify 2026-11-20). No requests means nothing failed.
          query: |
            (sum(rate(http_server_requests_seconds_count{service="{{args.service}}",outcome="SUCCESS"}[2m]))
            / sum(rate(http_server_requests_seconds_count{service="{{args.service}}"}[2m]))) or vector(1)
    - name: p99-latency
      interval: 1m
      count: 5
      # p99 ≤ 400 ms (owner decision 2026-11-20: "best possible value achievable"). Measured cmd-svc p99 under the
      # 200 req/s baseline was 297–346 ms across today's A/B runs (saturated, shedding); 400 ms is the tightest bound
      # all of them pass with ~15 % headroom. The old 5 ms would have aborted every real rollout. Tighten as the
      # payment path gets faster (re-measure with cluster-verify -f measure='200 60s').
      successCondition: result[0] <= 0.4
      provider:
        prometheus:
          address: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8429
          query: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{service="{{args.service}}"}[2m])) by (le)) or vector(0)
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: quarkus-cmd-svc }
spec:
  workloadRef: { apiVersion: apps/v1, kind: Deployment, name: quarkus-cmd-svc, scaleDown: progressively }
  progressDeadlineSeconds: 300      # auto-rollback if not healthy within 5 minutes (PDF §4.5)
  progressDeadlineAbort: true
  strategy:
    canary:
      steps:
        - setWeight: 10
        - analysis: { templates: [{ templateName: slo-gate }], args: [{ name: service, value: quarkus-cmd-svc }] }
        - setWeight: 50
        - pause: { duration: 2m }
