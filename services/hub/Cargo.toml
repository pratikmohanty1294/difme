[package]
name = "difme-quinn-hub"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "PDF §5.2 QUIC gateway: edge devices submit payments over QUIC; the hub forwards them to the core over gRPC and relays outcomes to live dashboards (SSE)."

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
